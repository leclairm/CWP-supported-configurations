spack:
  specs:
    - icon-nwp@develop +ecrad ~aes +jsbach +ocean +coupling ~rte-rrtmgp
      +icon4py +realloc-buf ~loop-exchange +mpi-gpu gpu=nvidia-90 +cuda-graphs +pgi-inlib fflags="-traceback"
      %c,cxx,fortran=nvhpc
  view: true
  concretizer:
    unify: true
  packages:
    mpi: {require: ["cray-mpich@9.1.0"]}
